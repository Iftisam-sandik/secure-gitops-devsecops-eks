name: Application CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: application-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Application Validation
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

      - name: Build application
        run: npm run build

  secret-scan:
    name: Gitleaks Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout full repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      security-events: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v4

  filesystem-scan:
    name: Trivy Filesystem Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Scan dependencies with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: 'fs'
          scan-ref: '.'
          scanners: 'vuln'
          vuln-type: 'library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

  terraform-scan:
    name: Checkov Terraform Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install checkov==3.3.21

      - name: Scan Terraform configuration
        run: checkov -d terraform --framework terraform --compact

  helm-scan:
    name: Checkov Helm Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Helm
        uses: azure/setup-helm@v5
        with:
          version: 'v4.3.0'

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Checkov
        run: python -m pip install checkov==3.3.21

      - name: Render Helm chart
        run: helm template ledgr helm/ledgr --namespace ledgr > /tmp/ledgr-rendered.yaml

      - name: Scan rendered Kubernetes manifests
        run: checkov -f /tmp/ledgr-rendered.yaml --framework kubernetes --compact --skip-check CKV_K8S_21

  container-build:
    name: Build ${{ matrix.name }} Image
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      id-token: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Backend
            dockerfile: server/Dockerfile
            image: ledgr-backend
          - name: Frontend
            dockerfile: client/Dockerfile
            image: ledgr-frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.3.0

      - name: Build image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ${{ matrix.image }}:ci

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: 'v0.75.0'
          scan-type: 'image'
          image-ref: '${{ matrix.image }}:ci'
          scanners: 'vuln'
          vuln-type: 'os,library'
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          format: 'table'
          exit-code: '1'

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0.24.0
        with:
          image: '${{ matrix.image }}:ci'
          format: 'cyclonedx-json'
          syft-version: 'v1.54.0'
          artifact-name: '${{ matrix.image }}-sbom.cdx.json'
          upload-artifact: true
          upload-artifact-retention: 7
          upload-release-assets: false

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::816975652337:role/secure-gitops-github-actions-ecr
          aws-region: ap-south-1
          allowed-account-ids: '816975652337'

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push scanned image to ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          EXISTING_IMAGES=$(aws ecr batch-get-image --repository-name "$IMAGE_NAME" --image-ids imageTag="$IMAGE_TAG" --query 'length(images)' --output text)

          if [ "$EXISTING_IMAGES" = "1" ]; then
            echo "Image $IMAGE_NAME:$IMAGE_TAG already exists in ECR; skipping push."
          else
            docker tag "$IMAGE_NAME:ci" "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
            docker push "$ECR_REGISTRY/$IMAGE_NAME:$IMAGE_TAG"
          fi

      - name: Install Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v4.1.2
        with:
          cosign-release: 'v3.1.3'

      - name: Resolve pushed image digest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: image_digest
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_NAME: ${{ matrix.image }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          IMAGE_DIGEST=$(aws ecr batch-get-image --repository-name "$IMAGE_NAME" --image-ids imageTag="$IMAGE_TAG" --query 'images[0].imageId.imageDigest' --output text)

          if [ -z "$IMAGE_DIGEST" ] || [ "$IMAGE_DIGEST" = "None" ]; then
            echo "Unable to resolve ECR image digest."
            exit 1
          fi

          echo "uri=$ECR_REGISTRY/$IMAGE_NAME@$IMAGE_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Sign image with Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: cosign sign --yes "${{ steps.image_digest.outputs.uri }}"

      - name: Verify Cosign signature
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign verify             --certificate-identity "https://github.com/${{ github.repository }}/.github/workflows/ci.yml@${{ github.ref }}"             --certificate-oidc-issuer "https://token.actions.githubusercontent.com"             "${{ steps.image_digest.outputs.uri }}"

  update-gitops-digests:
    name: Update GitOps Image Digests
    needs: container-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout triggering commit
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Check for newer main commit
        id: freshness
        run: |
          git fetch origin main
          LATEST_SHA=$(git rev-parse origin/main)

          if [ "$LATEST_SHA" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "A newer commit already exists on main; skipping stale digest update."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials
        if: steps.freshness.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::816975652337:role/secure-gitops-github-actions-ecr
          aws-region: ap-south-1
          allowed-account-ids: '816975652337'

      - name: Resolve ECR image digests
        if: steps.freshness.outputs.current == 'true'
        id: digests
        run: |
          BACKEND_DIGEST=$(aws ecr batch-get-image \
            --repository-name ledgr-backend \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'images[0].imageId.imageDigest' \
            --output text)

          FRONTEND_DIGEST=$(aws ecr batch-get-image \
            --repository-name ledgr-frontend \
            --image-ids imageTag="$GITHUB_SHA" \
            --query 'images[0].imageId.imageDigest' \
            --output text)

          if [[ ! "$BACKEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid backend digest: $BACKEND_DIGEST"
            exit 1
          fi

          if [[ ! "$FRONTEND_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "Invalid frontend digest: $FRONTEND_DIGEST"
            exit 1
          fi

          echo "backend=$BACKEND_DIGEST" >> "$GITHUB_OUTPUT"
          echo "frontend=$FRONTEND_DIGEST" >> "$GITHUB_OUTPUT"

      - name: Update EKS Helm image digests
        if: steps.freshness.outputs.current == 'true'
        env:
          BACKEND_DIGEST: ${{ steps.digests.outputs.backend }}
          FRONTEND_DIGEST: ${{ steps.digests.outputs.frontend }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("helm/ledgr/values-eks.yaml")
          text = path.read_text()

          updates = {
              "ledgr-backend": os.environ["BACKEND_DIGEST"],
              "ledgr-frontend": os.environ["FRONTEND_DIGEST"],
          }

          for image, digest in updates.items():
              pattern = re.compile(
                  rf'(?m)^([ \t]*repository:[ \t]*[^\n]*/{re.escape(image)}[ \t]*\n'
                  rf'[ \t]*digest:)[ \t]*.*$'
              )

              text, count = pattern.subn(
                  lambda match: f'{match.group(1)} "{digest}"',
                  text,
                  count=1,
              )

              if count != 1:
                  raise SystemExit(
                      f"STOP: expected one digest field for {image}, found {count}"
                  )

          path.write_text(text)
          PY

          git diff --check
          cat helm/ledgr/values-eks.yaml

      - name: Commit GitOps digest update
        if: steps.freshness.outputs.current == 'true'
        run: |
          if git diff --quiet -- helm/ledgr/values-eks.yaml; then
            echo "GitOps image digests are already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/ledgr/values-eks.yaml
          git commit -m "Update EKS image digests [skip ci]"
          git push origin HEAD:main
