apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  annotations:
    checkov.io/skip1: "CKV_K8S_15=The database image pull policy is intentionally stable; immutable digest pinning is planned during final image hardening."
    checkov.io/skip2: "CKV_K8S_43=The third-party MySQL image will be pinned by digest during final image hardening."
    checkov.io/skip3: "CKV_K8S_40=The official MySQL image uses its dedicated mysql runtime user, whose UID is below the Checkov high-UID threshold."
    checkov.io/skip4: "CKV_K8S_35=The official MySQL image consumes bootstrap credentials from Kubernetes Secret-backed environment variables."
    checkov.io/skip5: "CKV_K8S_22=MySQL requires writable runtime and persistent data paths."
    checkov.io/skip6: "CKV_K8S_23=The official MySQL entrypoint requires initialization privileges before dropping to the mysql runtime user."
    checkov.io/skip7: "CKV_K8S_37=The official MySQL entrypoint requires setup capabilities for writable database paths; NET_RAW is explicitly dropped."
spec:
  serviceName: mysql
  replicas: 1

  selector:
    matchLabels:
      app: mysql

  template:
    metadata:
      labels:
        app: mysql

    spec:
      automountServiceAccountToken: false

      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: mysql
          image: "{{ .Values.mysql.image.repository }}:{{ .Values.mysql.image.tag }}"
          imagePullPolicy: {{ .Values.mysql.image.pullPolicy }}

          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW

          ports:
            - name: mysql
              containerPort: {{ .Values.mysql.service.port }}

          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-root-password

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: mysql-password

            - name: MYSQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_DATABASE

            - name: MYSQL_USER
              valueFrom:
                configMapKeyRef:
                  name: {{ .Release.Name }}-config
                  key: MYSQL_USER

          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'
            initialDelaySeconds: 10
            periodSeconds: 5

          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - 'mysqladmin ping -h 127.0.0.1 -uroot -p"$MYSQL_ROOT_PASSWORD"'
            initialDelaySeconds: 30
            periodSeconds: 10

          resources:
{{ toYaml .Values.mysql.resources | indent 12 }}

          volumeMounts:
            - name: mysql-data
              mountPath: /var/lib/mysql

            - name: mysql-init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true

      volumes:
        - name: mysql-data
          persistentVolumeClaim:
            claimName: mysql-data

        - name: mysql-init
          configMap:
            name: mysql-init-schema
